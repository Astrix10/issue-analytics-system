<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Architecture: GitHub API to ingestion job to SQL database to FastAPI to React dashboard">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#7C8DA8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1000" height="240" rx="16" fill="#0F1B33"/>
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="38" font-size="15" font-weight="600" fill="#C7D0E0">How data flows</text>
    <rect x="22" y="70" width="150" height="70" rx="10" fill="#172544" stroke="#2C4A6B"/>
    <rect x="22" y="70" width="150" height="5" rx="2.5" fill="#94A3B8"/>
    <text x="97" y="101" font-size="15" font-weight="700" fill="#FFFFFF">GitHub API</text>
    <text x="97" y="123" font-size="12" fill="#C7D0E0">Pages + limits</text>
    <rect x="224" y="70" width="150" height="70" rx="10" fill="#172544" stroke="#2C4A6B"/>
    <rect x="224" y="70" width="150" height="5" rx="2.5" fill="#3DD6C0"/>
    <text x="299" y="101" font-size="15" font-weight="700" fill="#FFFFFF">Ingestion job</text>
    <text x="299" y="123" font-size="12" fill="#C7D0E0">Retries, upsert</text>
    <rect x="426" y="70" width="150" height="70" rx="10" fill="#172544" stroke="#2C4A6B"/>
    <rect x="426" y="70" width="150" height="5" rx="2.5" fill="#E8890C"/>
    <text x="501" y="101" font-size="15" font-weight="700" fill="#FFFFFF">SQL database</text>
    <text x="501" y="123" font-size="12" fill="#C7D0E0">SQLite → Postgres</text>
    <rect x="628" y="70" width="150" height="70" rx="10" fill="#172544" stroke="#2C4A6B"/>
    <rect x="628" y="70" width="150" height="5" rx="2.5" fill="#3DD6C0"/>
    <text x="703" y="101" font-size="15" font-weight="700" fill="#FFFFFF">FastAPI</text>
    <text x="703" y="123" font-size="12" fill="#C7D0E0">REST + API key</text>
    <rect x="830" y="70" width="150" height="70" rx="10" fill="#172544" stroke="#2C4A6B"/>
    <rect x="830" y="70" width="150" height="5" rx="2.5" fill="#7C9CFF"/>
    <text x="905" y="101" font-size="15" font-weight="700" fill="#FFFFFF">React dashboard</text>
    <text x="905" y="123" font-size="12" fill="#C7D0E0">Charts and search</text>
  </g>
  <line x1="176" y1="105" x2="220" y2="105" stroke="#4A6584" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></line>
  <circle cx="176" cy="105" r="4" fill="#3DD6C0"><animateMotion path="M0 0 L38 0" dur="1.2s" begin="0.0s" repeatCount="indefinite"/></circle>
  <line x1="378" y1="105" x2="422" y2="105" stroke="#4A6584" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></line>
  <circle cx="378" cy="105" r="4" fill="#3DD6C0"><animateMotion path="M0 0 L38 0" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>
  <line x1="580" y1="105" x2="624" y2="105" stroke="#4A6584" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></line>
  <circle cx="580" cy="105" r="4" fill="#3DD6C0"><animateMotion path="M0 0 L38 0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></circle>
  <line x1="782" y1="105" x2="826" y2="105" stroke="#4A6584" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></line>
  <circle cx="782" cy="105" r="4" fill="#3DD6C0"><animateMotion path="M0 0 L38 0" dur="1.2s" begin="0.8999999999999999s" repeatCount="indefinite"/></circle>
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13" fill="#9AA7BD">
    <text x="500" y="185">A sync runs on demand: POST /sync with an API key</text>
    <text x="500" y="208">Each page is saved as it arrives, and re-running a sync never creates duplicates</text>
  </g>
</svg>
